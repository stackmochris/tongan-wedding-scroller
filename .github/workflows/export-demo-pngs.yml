name: Export demo PNG assets
on:
  push:
    branches: [demo-opening-art-pack]
    paths:
      - 'assets/demo/**/*.svg'
      - 'scripts/export_demo_pngs.py'
      - '.github/workflows/export-demo-pngs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-opening-art-pack
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render PNGs
        run: |
          python -m pip install --disable-pip-version-check cairosvg Pillow
          python scripts/export_demo_pngs.py
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo/characters/*.png assets/demo/backgrounds/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Export 10 Godot-ready PNG demo assets"
          git push origin HEAD:demo-opening-art-pack
